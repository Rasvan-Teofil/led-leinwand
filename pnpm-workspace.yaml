# pnpm 12: explicit build-script policy for CI/Vercel (strictDepBuilds defaults to true).
# Denied packages are listed explicitly so install does not fail with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  unrs-resolver: true
  vue-demi: true
  core-js: false
