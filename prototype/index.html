<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LED-Leinwand Visualisierung</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <aside id="control-panel">
        <header>
          <h1>LED-Leinwand</h1>
          <p class="subtitle">Größe &amp; Pixelpitch im Raum erleben</p>
        </header>

        <section>
          <h2>Raum (Gottesdienstraum)</h2>
          <p class="field-hint">Maßstab: Bühne 8&nbsp;m (4×2&nbsp;m). Werte in <code>room-layout.js</code>.</p>
          <label>Tiefe Saal (Z, m) <input type="number" id="room-depth" min="8" max="24" step="0.5" /></label>
          <label>Breite Saal (X, m) <input type="number" id="room-width" min="12" max="35" step="0.5" /></label>
          <label>Höhe (m) <input type="number" id="room-height" min="3" max="15" step="0.5" /></label>
        </section>

        <section>
          <h2>LED-Wände</h2>
          <label>Wand wählen
            <select id="wall-select"></select>
          </label>
          <div class="btn-row">
            <button type="button" id="add-wall">+ Wand</button>
            <button type="button" id="remove-wall">− Wand</button>
          </div>
          <label>
            <input type="checkbox" id="compare-mode" />
            Vergleichsmodus (zwei Wände nebeneinander)
          </label>
        </section>

        <section>
          <h2>Abmessungen</h2>
          <label>Preset <select id="wall-preset"></select></label>
          <label>Breite (m) <input type="number" id="wall-width" min="1" max="20" step="0.25" /></label>
          <label>Höhe (m) <input type="number" id="wall-height" min="1" max="12" step="0.25" /></label>
          <label>Cabinet <select id="cabinet-preset"></select></label>
          <label>Spalten <input type="number" id="cab-cols" min="1" max="40" /></label>
          <label>Zeilen <input type="number" id="cab-rows" min="1" max="24" /></label>
          <label>Montagehöhe Boden (m) <input type="number" id="mount-height" min="0" max="4" step="0.1" /></label>
        </section>

        <section>
          <h2>Pixelpitch</h2>
          <label>Preset <select id="pitch-preset"></select></label>
          <label>Eigener Wert (mm) <input type="number" id="pitch-custom" min="0.5" max="20" step="0.1" /></label>
          <label>
            <input type="checkbox" id="pitch-toggle" />
            Pitch umschalten (Vergleich)
          </label>
          <label>Alternativer Pitch (mm) <input type="number" id="alt-pitch" value="1.9" min="0.5" max="20" step="0.1" /></label>
        </section>

        <section>
          <h2>Inhalt</h2>
          <label>
            <select id="content-type">
              <option value="lyrics">Liedtext-Folie</option>
              <option value="photo">Beispiel-Foto</option>
            </select>
          </label>
        </section>

        <section>
          <h2>Kamera</h2>
          <div class="btn-row">
            <button type="button" id="view-first">Erste Reihe</button>
            <button type="button" id="view-mid">Mitte</button>
            <button type="button" id="view-back">Letzte Reihe</button>
            <button type="button" id="view-tech">Tech-Pult</button>
          </div>
          <label>Abstand zur Wand: <span id="view-distance-label">—</span></label>
          <input type="range" id="view-distance" min="2" max="16" step="0.1" />
          <button type="button" id="fp-mode" class="secondary">Erste-Person (WASD, Maus)</button>
        </section>

        <section id="stats-panel"></section>
      </aside>
      <main id="viewport">
        <canvas id="scene-canvas"></canvas>
        <p class="hint">Maus: drehen/zoomen · Rechtsklick: schwenken</p>
      </main>
    </div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
